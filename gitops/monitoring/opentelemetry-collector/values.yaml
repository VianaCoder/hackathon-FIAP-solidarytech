# OpenTelemetry Collector Helm values for SolidaryTech
# Chart: open-telemetry/opentelemetry-collector
# This collector is the central hub for all telemetry:
#   - Receives OTLP (gRPC:4317, HTTP:4318) from microservices
#   - Exports metrics to Prometheus via prometheus exporter
#   - Exports logs to Loki (OTLP format, via gRPC)
#   - Exports traces via the debug/logging exporter placeholder below;
#     replace it with a real APM backend exporter (Datadog, New Relic,
#     Jaeger, Tempo, etc.) once a provider and credentials are chosen.

mode: deployment
replicaCount: 2

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.104.0"

serviceAccount:
  create: true

clusterRole:
  create: true

# ============================================================
# Presets: automatically add env vars, volumes, etc.
# ============================================================
presets:
  kubeletMetrics:
    enabled: true
  hostMetrics:
    enabled: true
  clusterMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: true

# ============================================================
# Config: receivers, processors, exporters
# ============================================================
config:
  # ========== RECEIVERS ==========
  receivers:
    # Receive OTLP telemetry (metrics, logs, traces) from microservices
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318

    # Host infrastructure metrics
    hostmetrics:
      collection_interval: 10s
      scrapers:
        paging:
          metrics:
            system.paging.utilization:
              enabled: true
        cpu:
          metrics:
            system.cpu.utilization:
              enabled: true
        disk: {}
        filesystem:
          metrics:
            system.filesystem.utilization:
              enabled: true
        load: {}
        memory: {}
        network: {}
        processes: {}

    # Collect Prometheus metrics from the collector itself
    prometheus:
      config:
        scrape_configs:
          - job_name: otel-collector
            scrape_interval: 30s
            static_configs:
              - targets: ["${env:MY_POD_IP}:8888"]

  # ========== PROCESSORS ==========
  processors:
    # Batch: reduces API calls by batching spans/metrics/logs
    batch:
      send_batch_max_size: 100
      send_batch_size: 10
      timeout: 10s

    # Memory limiter: prevents OOM by dropping data if memory exceeds threshold
    memory_limiter:
      check_interval: 1s
      limit_mib: 1024
      spike_limit_mib: 256

    # Resource detection: add cloud/container/host attributes
    resourcedetection/system:
      detectors: [env, system]
      timeout: 2s

    # Add custom attributes to all telemetry (e.g., environment, namespace)
    attributes:
      actions:
        - key: environment
          value: production
          action: update
        - key: service.namespace
          from_attribute: k8s.namespace.name
          action: upsert

  # ========== EXPORTERS ==========
  exporters:
    # Export metrics to Prometheus (Prometheus scrapes this endpoint)
    prometheus:
      endpoint: "${env:MY_POD_IP}:8889"

    # Export logs to Loki via OTLP/gRPC
    otlp/loki:
      endpoint: loki.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
      sending_queue:
        enabled: true
        num_consumers: 4
        queue_size: 5000

    # Placeholder trace exporter. Replace with a real APM backend
    # (datadog, otlp/jaeger, otlp/tempo, etc.) before relying on traces
    # in production. Left as debug to avoid inventing credentials.
    debug: {}

  # ========== SERVICE ==========
  service:
    telemetry:
      metrics:
        address: ${env:MY_POD_IP}:8888
    pipelines:
      # Metrics pipeline: OTLP + host + collector metrics -> Prometheus export
      metrics:
        receivers: [otlp, hostmetrics, prometheus]
        processors: [memory_limiter, batch, resourcedetection/system, attributes]
        exporters: [prometheus]

      # Logs pipeline: OTLP logs -> Loki export
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch, resourcedetection/system, attributes]
        exporters: [otlp/loki]

      # Traces pipeline: OTLP traces -> debug exporter placeholder
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch, resourcedetection/system]
        exporters: [debug]

# ============================================================
# Ports: expose OTLP receivers and Prometheus exporter
# ============================================================
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

# ============================================================
# Service type: ClusterIP for internal communication
# ============================================================
service:
  type: ClusterIP

# ============================================================
# Resources
# ============================================================
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 512Mi

# ============================================================
# Pod disruption budget (ensure availability during upgrades)
# ============================================================
podDisruptionBudget:
  enabled: true
  minAvailable: 1
