apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: donation-service
  namespace: argocd
spec:
  project: default
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: donation-secret
      namespace: ns-donation
      jsonPointers:
        - /data
        - /stringData
  source:
    repoURL: https://github.com/VianaCoder/hackathon-FIAP-solidarytech.git
    targetRevision: main
    path: gitops/services/donation-service
  destination:
    server: https://kubernetes.default.svc
    namespace: ns-donation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
