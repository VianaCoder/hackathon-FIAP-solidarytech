apiVersion: v1
kind: ConfigMap
metadata:
  name: ngo-config
  namespace: ns-ngo
data:
  PORT: "8081"
---
apiVersion: v1
kind: Secret
metadata:
  name: ngo-secret
  namespace: ns-ngo
type: Opaque
stringData:
  DATABASE_URL: "REDACTED_DATABASE_URL"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngo-service
  namespace: ns-ngo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ngo-service
  template:
    metadata:
      labels:
        app: ngo-service
    spec:
      initContainers:
        - name: ngo-db-migration
          image: postgres:16-alpine
          command:
            - sh
            - -ec
            - |
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS ngos (
                  id SERIAL PRIMARY KEY,
                  name VARCHAR(150) NOT NULL,
                  email VARCHAR(100) UNIQUE NOT NULL,
                  cause VARCHAR(100) NOT NULL,
                  city VARCHAR(100) NOT NULL,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );
              SQL
          envFrom:
            - configMapRef:
                name: ngo-config
            - secretRef:
                name: ngo-secret
      containers:
        - name: ngo-service
          image: 127214161915.dkr.ecr.us-east-1.amazonaws.com/ngo-service:v1.0.0-b582c91
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: ngo-config
            - secretRef:
                name: ngo-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ngo-service
  namespace: ns-ngo
spec:
  type: ClusterIP
  selector:
    app: ngo-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
