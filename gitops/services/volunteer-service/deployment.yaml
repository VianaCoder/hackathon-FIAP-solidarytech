apiVersion: v1
kind: ServiceAccount
metadata:
  name: volunteer-service
  namespace: ns-volunteer
  annotations:
    # IRSA role granting dynamodb read/write on SolidaryTechVolunteers (see infra/terraform/environments/dev/irsa.tf).
    eks.amazonaws.com/role-arn: "arn:aws:iam::127214161915:role/solidarytech-dev-volunteer-service-irsa"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: volunteer-config
  namespace: ns-volunteer
data:
  PORT: "8083"
  AWS_REGION: "us-east-1"
  AWS_DYNAMODB_TABLE: "SolidaryTechVolunteers"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer-service
  namespace: ns-volunteer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: volunteer-service
  template:
    metadata:
      labels:
        app: volunteer-service
    spec:
      serviceAccountName: volunteer-service
      containers:
        - name: volunteer-service
          image: 127214161915.dkr.ecr.us-east-1.amazonaws.com/volunteer-service:v1.0.0-b582c91
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: volunteer-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: volunteer-service
  namespace: ns-volunteer
spec:
  type: ClusterIP
  selector:
    app: volunteer-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
