apiVersion: v1
kind: ServiceAccount
metadata:
  name: donation-service
  namespace: ns-donation
  annotations:
    # IRSA role granting sqs:SendMessage on the donations queue (see infra/terraform/environments/dev/irsa.tf).
    eks.amazonaws.com/role-arn: "arn:aws:iam::127214161915:role/solidarytech-dev-donation-service-irsa"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: donation-config
  namespace: ns-donation
data:
  PORT: "8082"
  AWS_REGION: "us-east-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: donation-secret
  namespace: ns-donation
type: Opaque
stringData:
  DATABASE_URL: "REDACTED_DATABASE_URL"
  AWS_SQS_URL: "https://sqs.<AWS_REGION>.amazonaws.com/<AWS_ACCOUNT_ID>/solidary-donations"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-service
  namespace: ns-donation
spec:
  replicas: 3
  selector:
    matchLabels:
      app: donation-service
  template:
    metadata:
      labels:
        app: donation-service
    spec:
      serviceAccountName: donation-service
      initContainers:
        - name: donation-db-migration
          image: postgres:16-alpine
          command:
            - sh
            - -ec
            - |
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS donations (
                  id SERIAL PRIMARY KEY,
                  ngo_id INT NOT NULL,
                  amount NUMERIC(10, 2) NOT NULL,
                  donor_name VARCHAR(100) NOT NULL,
                  status VARCHAR(20) NOT NULL,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );
              SQL
          envFrom:
            - configMapRef:
                name: donation-config
            - secretRef:
                name: donation-secret
      containers:
        - name: donation-service
          image: 127214161915.dkr.ecr.us-east-1.amazonaws.com/donation-service:v1.0.0-ae8cdc2
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: donation-config
            - secretRef:
                name: donation-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "700m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: donation-service
  namespace: ns-donation
spec:
  type: ClusterIP
  selector:
    app: donation-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
